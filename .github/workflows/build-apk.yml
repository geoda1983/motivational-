name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "$JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java Major Version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ] || [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java version is lower than 17 (detected: $JAVA_MAJOR)"
            exit 1
          fi
          echo "Java environment verified successfully (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "debug.keystore already exists."
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Debug keystore verified at ./debug.keystore"

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK output
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$TARGET_APK" ]; then
            echo "Found debug APK at $TARGET_APK"
          else
            echo "ERROR: Expected APK not found at $TARGET_APK"
            echo "Searching for APKs inside app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk" -type f
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
